# Utility outage feeds not on KUBRA. All public, no key. Evidence = open-source projects reading them.

- id: duke_energy
  type: arcgis
  name: Duke Energy
  states: [NC, SC, FL, IN, OH, KY]
  url: https://services3.arcgis.com/oX5r75R7mapdoI2F/ArcGIS/rest/services/Duke_Energy_Distribution_Outages_Public/FeatureServer/0
  category: power
  id_field: OBJECTID
  title: "{AFFECTED_CUSTOMERS:,} customers out — {CAUSE}"
  area: "Duke Energy ({JURISDICTION})"
  severity: {field: AFFECTED_CUSTOMERS, thresholds: [[5000, severe], [1000, moderate]], default: minor}
  starts_field: START_TIME
  updated_field: last_edited_date
  metrics: {customers_out: AFFECTED_CUSTOMERS, etr: ETR, cause: CAUSE, crew_status: CREW_STATUS, jurisdiction: JURISDICTION}
  time_metrics: [etr]
  constants: {kind: outage, utility: Duke Energy}
  meta:
    confidence: high
    evidence: "github.com/codebooker/AmericaMap proxy.py (2026); github.com/SecuritahGuy/openrisk-radar nc.json (2026)"
    notes: "Duke's public ArcGIS layer (outage points, all jurisdictions)"

- id: fpl_counties
  type: county_outages
  name: FPL
  states: [FL]
  url: https://www.fplmaps.com/customer/outage/CountyOutages.json
  records: outages
  county_field: County Name
  out_field: Customers Out
  served_field: Customers Served
  link: https://www.fplmaps.com/
  meta:
    confidence: high
    evidence: "github.com/lukesteve03/OpenSourcePowerOutageScraper collectors/fpl.py (2026); github.com/simonw/irma-scrapers irma.py FplCountyOutages (2022); github.com/GateHouseMedia/power-outages fplreport2.py (2020)"

- id: fpl_points
  type: json
  name: FPL outage points
  states: [FL]
  url: https://www.fplmaps.com/customer/outage/StormFeedRestoration.json
  records: outages
  lat: lat
  lon: lng
  category: power
  id_field: ticketNum
  title: "{customersAffected:,} customers out — {Cause}"
  severity: {field: customersAffected, thresholds: [[5000, severe], [1000, moderate]], default: minor}
  metrics: {customers_out: customersAffected, etr: etr, status: status, cause: Cause}
  constants: {kind: outage, utility: FPL}
  meta:
    confidence: medium
    evidence: "github.com/simonw/scrape-florida-outages (working 2026-09)"
    notes: "One source (simonw's other FPL scraper reads CountyOutages.json, not this file)"

