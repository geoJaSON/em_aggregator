# DataCapable/utilisocial outage maps (same event format as CenterPoint and Entergy events).

- id: datacapable_dlc_pa
  type: json
  name: "Duquesne Light"
  states: [PA]
  url: "https://utilisocial.io/datacapable/v2/p/dlc/map/events"
  lat: latitude
  lon: longitude
  category: power
  id_field: id
  title: "{numPeople:,} customers out — {cause}"
  severity: {field: numPeople, thresholds: [[5000, severe], [1000, moderate]], default: minor}
  starts_field: startTime
  updated_field: lastUpdatedTime
  exclude: {type: PLANNED_OUTAGE}
  metrics: {customers_out: numPeople, etr: etrTime, status: status, cause: cause}
  time_metrics: [etr]
  constants: {kind: outage, utility: "Duquesne Light"}
  meta:
    confidence: medium
    evidence: "lukesteve03/OpenSourcePowerOutageScraper sources_config (2026)"

