# --- OSI Public Outage Portal (type: osi_pop) ---------------------------------------------------------------

- id: osi_pop_black_hills
  type: osi_pop
  name: "Black Hills Energy"
  states: [CO, MT, SD, WY]
  url: https://www.blackhillsenergy.com
  link: https://www.blackhillsenergy.com/
  customers_served: 225000
  meta:
    confidence: high
    evidence: "github.com/aachokey/denver-outages get_data.yml + recorded PopOutage snapshots (2025-12); github.com/lukesteve03/OpenSourcePowerOutageScraper pop_sources.json + pop_base.py (2026)"
    notes: "Electric service only (ServiceType=Electric). Outage areas are Black Hills service areas (e.g. Pueblo North), not counties. customers_served: about 225,000 electric customers in CO, MT, SD and WY (Black Hills Corp. Form 10-K for 2024, sec.gov); used instead of the summary's totalCount, which may list only areas with outages."

