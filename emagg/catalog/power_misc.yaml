# --- WEC Energy Group OutageEventJSON (type: wec_outages) ---------------------------------------------------

- id: wec_we_energies
  type: wec_outages
  name: "We Energies"
  states: [WI, MI]
  url: https://www.we-energies.com/outagesummary/view/OutageEventJSON
  link: https://www.we-energies.com/outagesummary/view/outagegrid
  customers_served: 1260000
  meta:
    confidence: high
    evidence: "github.com/tmoody1973/mke-power-outage-tracker fetch_outages.py + git-scraped latest.json (2026-09-27); github.com/lukesteve03/OpenSourcePowerOutageScraper outageeventjson_sources.json (2026); github.com/codebooker/AmericaMap proxy.py (2026)"
    notes: "Serves southeast / Fox Valley WI and part of Michigan's Upper Peninsula. The feed has no utility-wide customer count; customers_served is the sum of the largest RegionCusts recorded per region in the mke tracker's history (southeast wi 1,075,211 + fox valley wi 143,501 + upper peninsula mi 41,427 = 1,260,139, 2026). codebooker/AmericaMap uses 1,100,000."

- id: wec_wps
  type: wec_outages
  name: "Wisconsin Public Service"
  states: [WI]
  url: https://www.wisconsinpublicservice.com/outagesummary/view/OutageEventJSON
  link: https://www.wisconsinpublicservice.com/outagesummary/view/outagegrid
  customers_served: 450000
  meta:
    confidence: high
    evidence: "github.com/lukesteve03/OpenSourcePowerOutageScraper outageeventjson_sources.json (2026); github.com/codebooker/AmericaMap proxy.py (2026)"
    notes: "customers_served is the figure codebooker/AmericaMap uses; the feed has none."

