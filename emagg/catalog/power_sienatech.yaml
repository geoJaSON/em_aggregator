- id: sienatech_demco_la
  type: sienatech
  name: Dixie Electric Membership Corporation (DEMCO)
  states: [LA]
  enabled: false
  code: DEMCO
  meta:
    confidence: low
    evidence: "github.com/mefferso/cwa-outage-viewer docs/app.js (2026: cache.sienatech.com/apex/siena_ords/webmaps/lines/DEMCO/temp, the same API's outage-line layer); web: demco.internal.maps.sienatech.com (2026)"
    notes: "Off by default: DEMCO is covered by wov_dixie_la (Milsoft WOV at outagemap.dixie.coop, medium). Enable only one of the two, or DEMCO is counted twice in the Power and LA totals. Tenant code seen only on the line layer of this ORDS API, not on the OUTAGE document"

