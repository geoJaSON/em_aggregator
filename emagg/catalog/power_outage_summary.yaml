- id: wov_bemcc_al
  type: milsoft_wov
  name: "Baldwin EMC"
  states: [AL]
  enabled: false
  url: https://oms.baldwinemc.com:82/
  meta:
    confidence: low
    evidence: "github.com/lukesteve03/OpenSourcePowerOutageScraper outage-scraper/config/sources_config/kubra_v2_sources.json (2026)"
    notes: "Off by default: lukesteve03 turns off TLS certificate checks for this host (https on port 82, verify_ssl false) and the shared client always verifies certificates, so every poll would fail with a TLS error. Switch it on with catalog.enable once `emagg poll` succeeds (the utility fixes its certificate). Milsoft Web Outage Viewer: utility total, outage points, and counties when boundaries.json has a county/parish layer"

