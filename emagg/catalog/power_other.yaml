- id: odin_counties
  type: county_outages
  name: ODIN (ORNL)
  enabled: false
  url: https://openenergyhub.ornl.gov/api/explore/v2.1/catalog/datasets/odin-real-time-outages-county/exports/json
  fips_field: communitydescriptor
  out_field: metersaffected
  utility_field: name
  meta:
    confidence: medium
    evidence: "github.com/bradleybond512/crystal-ball api/grid-outages.js (2026)"
    notes: "National county-level outages from utilities participating in ORNL's ODIN. Off by default: it can repeat utilities already configured (e.g. CenterPoint) and double-count in state totals."
