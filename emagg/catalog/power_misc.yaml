# Utility outage maps on smaller platforms: PacifiCorp's outage-map files, OSI (Emerson) Public Outage Portal,
# WEC Energy Group's OutageEventJSON and NorthWestern Energy's {"d": ...} feed. All public JSON behind the
# utilities' own outage maps; no key. Evidence = open-source projects reading the same endpoints.

# --- PacifiCorp (type: pacificorp) ------------------------------------------------------------------------

- id: pacificorp_rmp_ut
  type: pacificorp
  name: "Rocky Mountain Power (UT)"
  states: [UT]
  site: https://www.rockymountainpower.net
  state: UT
  link: https://www.rockymountainpower.net/outages-safety.html
  meta:
    confidence: high
    evidence: "github.com/richardsondev/rmp-outages mapUT.json + listUT.json git-scraped every 15 min (2026-09-27); github.com/lukesteve03/OpenSourcePowerOutageScraper pacificorp_sources.json listUT (2026); github.com/codebooker/AmericaMap proxy.py mapUT (2026); github.com/SecuritahGuy/openrisk-radar ut.json (2026)"
    notes: "Outage points (map), county breakdown (list) and state total. No customers-served figure."

