# Co-op outage maps on Siena Technologies WebMaps (<code>.maps.sienatech.com). Public JSON, no key:
#   https://cache.sienatech.com/apex/siena_ords/webmaps/data/<code>/OUTAGE
# Utility total + county events (the map's "County" report) + outage points when the feed carries positions.
#
# Confidence is low throughout: the one open-source collector for this endpoint (lukesteve03) ships the tenant
# list and parser but has its Sienatech runner commented out, and treats HTTP 420/5xx as "no data". Run
# `emagg poll` before relying on these. The tenant code matches the map's subdomain wherever both are known
# (bremco, bemc, joemc, dec, core, unitil, demco), which is how the extra, disabled entries were found.

- id: sienatech_ssemc_ga
  type: sienatech
  name: Snapping Shoals EMC
  states: [GA]
  code: SSEMC
  meta:
    confidence: low
    evidence: "github.com/lukesteve03/OpenSourcePowerOutageScraper outage-scraper/config/sources_config/sienatech_sources.json + core/registry/base_collectors/sienatech_base.py (2026)"
    notes: "Collector present but disabled in that repo's runner; verify with `emagg poll`"

