# Utility outage maps published as ArcGIS layers (queried with the generic arcgis adapter; servers that
# reject GeoJSON are re-queried as Esri JSON). Customer counts roll up per utility via constants.

- id: esri_xcel_energy
  type: arcgis
  name: "Xcel Energy"
  states: [CO, KS, MN, ND, NM, OK, SD, TX, WI]
  url: "https://emcs-gis.esriemcs.com/arcgis/rest/services/Xcel/XcelOutage/MapServer/3"
  where: "1=1"
  category: power
  id_field: globalid
  title: "{customers} customers out"
  severity: {field: customers, thresholds: [[5000, severe], [1000, moderate]], default: minor}
  starts_field: off_
  metrics: {customers_out: customers, etr: etr, county: county}
  time_metrics: [etr]
  constants: {kind: outage, utility: "Xcel Energy"}
  interval: 600
  meta:
    confidence: high
    evidence: "lukesteve03/OpenSourcePowerOutageScraper sources_config (2026); codebooker/AmericaMap; BB-TStone/B-B-Power (2026)"

