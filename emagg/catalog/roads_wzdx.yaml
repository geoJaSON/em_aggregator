# State/local DOT Work Zone Data Exchange (WZDx) feeds, from the USDOT WZDx Feed Registry
# (data.transportation.gov dataset 69qe-yiui, snapshot 2026-08-07). Only full closures in effect now are
# shown by default (closures_only). Feeds that need a key stay 'not configured' until the env var is set.

- id: wzdx_az_mcdot
  type: wzdx
  name: "Maricopa County DOT work zones"
  states: [AZ]
  url: "https://wzdxapi.aztech.org/construction"
  meta:
    confidence: high
    evidence: "USDOT WZDx Feed Registry (version 4.2, updates 1m)"

- id: wzdx_ca_mtc
  type: wzdx
  name: "San Francisco Bay Area (MTC 511) work zones"
  states: [CA]
  url: "https://api.511.org/traffic/wzdx?api_key={api_key}"
  api_key: ${WZDX_CA_MTC_KEY}
  meta:
    confidence: high
    evidence: "USDOT WZDx Feed Registry (version 4.1, updates 5m)"
    signup: "https://511.org/open-data/token"
    notes: "Needs an API key: set WZDX_CA_MTC_KEY"

