# EM Aggregator configuration. Copy to config.yaml and edit. With no config.yaml the app runs nationally with
# every open catalog feed. Any value can pull from the environment: ${NAME} or ${NAME:-default}.

app:
  title: "EM Aggregator"
  # api.weather.gov requires an identifying User-Agent with contact info.
  user_agent: "em-aggregator (eoc@your-agency.gov)"
  db_path: "data/emagg.sqlite"
  retention_hours: 72          # how long cleared events stay queryable
  # write_token: ${EMAGG_WRITE_TOKEN}   # if set, field reports / manual refresh need header X-EMAgg-Token

area:
  # Presets: national, conus, gulf_southeast, gulf_coast, southeast_atlantic, mid_atlantic, northeast.
  # Setting name/bbox/states here overrides the preset's values.
  preset: gulf_southeast
  # states: [TX, LA, MS, AL, FL, GA, SC, NC]
  # bbox: [-106.7, 24.3, -75.3, 36.7]     # [min_lon, min_lat, max_lon, max_lat]

# The built-in catalog (emagg/catalog/*.yaml, listed in docs/CATALOG.md or `emagg catalog`) adds every known feed
# for the area's states: power utilities, DOT closures, 511, plus the national hazard/comms feeds.
catalog:
  enabled: true
  # states: [FL, GA]            # default: area.states (empty = all states)
  # types: [kubra, wzdx]        # only these adapter types
  # exclude: [nc_drivenc]       # skip specific catalog ids
  # enable: [odin_counties]     # switch on entries that are off by default

# Keys for catalog feeds that need one (free self-service unless noted). Set as environment variables:
#   LA511_KEY, GA511_KEY, DRIVENC_KEY   511LA / 511GA / DriveNC developer keys
#   FL511_KEY                           FL511 (FDOT data agreement)
#   DRIVETEXAS_KEY                      DriveTexas (application; intended for emergency management)
#   NY511_KEY, NV511_KEY, WZDX_*_KEY    other states (see docs/CATALOG.md)

sources:
  # Your own feeds, or overrides of catalog entries (same id = replaces the catalog entry).

  # Example: also pull individual outage locations for one catalog utility (more requests per poll).
  # - id: kubra_ga_power_ga
  #   type: kubra
  #   name: Georgia Power
  #   states: [GA]
  #   instance_id: 7b38c047-7950-444b-a25c-9b3e5ab986eb
  #   view_id: 67b44af5-3847-4ca3-9f4e-9190aac343d6
  #   outage_points: true
  #   max_tile_requests: 150

  # Another utility on KUBRA Storm Center. Find the IDs: open its outage map with browser dev tools
  # (Network tab) and look for kubra.io/stormcenter/api/v1/stormcenters/<instance_id>/views/<view_id>/currentState
  - id: my_utility
    type: kubra
    enabled: false
    name: "My Utility"
    states: [FL]
    instance_id: "00000000-0000-0000-0000-000000000000"
    view_id: "00000000-0000-0000-0000-000000000000"
    link: "https://outagemap.example.com"

  # Waze for Cities partner feed (free for government agencies; the URL contains your token).
  - id: waze
    type: waze
    enabled: false
    url: ${WAZE_FEED_URL}
    # min_reliability: 5
    # include_jams: false

  # Any ArcGIS layer: county road closures, evacuation zones, a utility's ESRI outage map...
  - id: county_closures
    type: arcgis
    enabled: false
    name: "County road closures"
    states: [FL]
    url: "https://services.arcgis.com/XXXX/arcgis/rest/services/Road_Closures/FeatureServer/0"
    where: "STATUS = 'Closed'"
    category: roads     # weather | flood | tropical | power | comms | roads | transport | fire | seismic | shelter | other
    id_field: OBJECTID
    title: "Road closed: {ROAD_NAME}"
    description: "{REASON}"
    severity: {field: STATUS, map: {Closed: severe, Restricted: moderate}, default: minor}
    # severity: {field: LANES, contains: {"all lanes": severe}, default: minor}      # substring match
    # severity: {field: CUSTOMERS, thresholds: [[5000, severe], [1000, moderate]]}   # numeric
    updated_field: EditDate
    metrics: [DETOUR, AGENCY]

  # Any JSON API returning records with coordinates (nested fields are flattened with "_").
  - id: some_outage_list
    type: json
    enabled: false
    name: "Co-op outages"
    states: [GA]
    url: "https://example.coop/outages.json"
    records: data.outages
    lat: location_lat
    lon: location_lng
    category: power
    id_field: id
    title: "{customers} customers out"
    severity: {field: customers, thresholds: [[5000, severe], [1000, moderate]], default: minor}
    metrics: {customers_out: customers, etr: etr}
    time_metrics: [etr]
    constants: {kind: outage, utility: Example Co-op}   # lets state/utility power totals include it

  # Per-county outage tables (drawn as county outlines).
  - id: some_county_table
    type: county_outages
    enabled: false
    name: "Example Utility"
    states: [FL]
    url: "https://example.com/county_outages.json"
    records: counties
    county_field: County
    out_field: Out
    served_field: Served
