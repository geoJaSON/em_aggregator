[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emagg"
version = "0.1.0"
description = "Near-real-time aggregator for emergency management situational awareness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emagg = "emagg.cli:main"

[tool.setuptools.packages.find]
include = ["emagg*"]

[tool.setuptools.package-data]
emagg = ["web/*", "web/vendor/leaflet/*", "web/vendor/markercluster/*", "web/vendor/leaflet/images/*", "demo_data/*", "data/*", "catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
