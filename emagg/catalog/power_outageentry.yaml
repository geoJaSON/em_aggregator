# Utilities on CFA Software's OutageEntry map (www.outageentry.com/Outage/outage.php?Client=<client>). Public, no key.
# One form POST per poll to /Outage/ajax/ajaxShellOut.php (target=cfa_device_markers). Utility total from the
# markers + outage points when markers carry positions. The feed has no customers-served figure, so
# customers_served comes from lukesteve03's missing_customers_served.json (2026). Naive local times are read
# in `timezone` (set here for split-zone states, otherwise derived from `states`).

- id: outageentry_greys_ga
